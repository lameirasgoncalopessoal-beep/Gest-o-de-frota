<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Gestão de Frota</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f2f4f7;color:#18212b}
button,input,select{font:inherit}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f2f4f7}
.login-card{width:100%;max-width:390px;background:white;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.10)}
.logo{font-size:28px;font-weight:800;text-align:center;margin-bottom:6px}
.subtitle{text-align:center;color:#697586;margin:0 0 25px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 7px}
input,select{width:100%;border:1px solid #d6dbe1;border-radius:11px;padding:13px 14px;background:#fff;outline:none}
input:focus,select:focus{border-color:#333;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.primary{width:100%;border:0;border-radius:11px;padding:14px;margin-top:20px;background:#111827;color:white;font-weight:700;cursor:pointer}
.primary:active{transform:scale(.99)}
.error{display:none;background:#fff1f1;color:#b42318;border-radius:10px;padding:10px 12px;margin-top:14px;font-size:14px;text-align:center}
.hint{text-align:center;color:#8a94a3;font-size:12px;margin-top:15px}
.app{display:none;min-height:100vh}
.header{background:#111827;color:white;padding:16px 18px;position:sticky;top:0;z-index:5}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-size:21px;font-weight:800}
.logout{background:#fff;color:#111827;border:0;border-radius:9px;padding:9px 12px;font-weight:700}
.nav{display:flex;gap:8px;overflow:auto;padding:12px;background:white;border-bottom:1px solid #e4e7eb}
.nav button{white-space:nowrap;border:1px solid #d8dde3;background:white;border-radius:9px;padding:9px 12px}
.nav button.active{background:#111827;color:white;border-color:#111827}
main{max-width:1100px;margin:auto;padding:18px}
.page{display:none}.page.active{display:block}
.card{background:white;border-radius:14px;padding:17px;margin-bottom:15px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{padding:17px;border-radius:12px;background:#f7f8fa}.stat strong{display:block;font-size:28px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:13px;color:#697586}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #edf0f2;font-size:14px}
.action{border:1px solid #d8dde3;background:white;border-radius:8px;padding:6px 9px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.add{margin-top:12px}
@media(max-width:600px){main{padding:12px}.card{padding:14px}th,td{font-size:13px}}
</style>
</head>
<body>

<section id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="logo">Gestão de Frota</div>
    <p class="subtitle">Inicie sessão para continuar</p>

    <form id="loginForm" novalidate>
      <label for="loginUser">Utilizador</label>
      <input id="loginUser" name="loginUser" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">

      <label for="loginPass">Palavra-passe</label>
      <input id="loginPass" name="loginPass" type="password" autocomplete="new-password">

      <button id="loginButton" class="primary" type="submit">Entrar</button>
      <div id="loginError" class="error">Utilizador ou palavra-passe incorretos.</div>
    </form>
    <div class="hint">Os campos ficam vazios por segurança.</div>
  </div>
</section>

<section id="app" class="app">
  <header class="header">
    <div class="header-row">
      <div class="title">Gestão de Frota</div>
      <button class="logout" id="logoutButton" type="button">Sair</button>
    </div>
  </header>

  <nav class="nav">
    <button class="navbtn active" data-page="dashboard">Início</button>
    <button class="navbtn" data-page="tratores">Tratores</button>
    <button class="navbtn" data-page="reboques">Reboques</button>
    <button class="navbtn" data-page="maquinas">Máquinas</button>
    <button class="navbtn" data-page="pessoal">Pessoal</button>
    <button class="navbtn" data-page="definicoes">Definições</button>
  </nav>

  <main>
    <section id="dashboard" class="page active">
      <div class="card"><h2>Resumo</h2><div class="grid" id="stats"></div></div>
    </section>

    <section id="tratores" class="page">
      <div class="card"><h2>Tratores</h2><div id="tratoresList"></div><div class="form-grid"><input id="tratorNome" placeholder="Matrícula / identificação"><input id="tratorMarca" placeholder="Marca / modelo"></div><button class="primary add" type="button" onclick="addItem('tratores')">Adicionar trator</button></div>
    </section>

    <section id="reboques" class="page">
      <div class="card"><h2>Reboques</h2><div id="reboquesList"></div><div class="form-grid"><input id="reboqueNome" placeholder="Matrícula / identificação"><input id="reboqueTipo" placeholder="Tipo"></div><button class="primary add" type="button" onclick="addItem('reboques')">Adicionar reboque</button></div>
    </section>

    <section id="maquinas" class="page">
      <div class="card"><h2>Máquinas</h2><div id="maquinasList"></div><div class="form-grid"><input id="maquinaNome" placeholder="Identificação"><input id="maquinaTipo" placeholder="Tipo / modelo"></div><button class="primary add" type="button" onclick="addItem('maquinas')">Adicionar máquina</button></div>
    </section>

    <section id="pessoal" class="page">
      <div class="card"><h2>Pessoal</h2><div id="pessoalList"></div><div class="form-grid"><input id="pessoaNome" placeholder="Nome"><input id="pessoaFuncao" placeholder="Função"></div><button class="primary add" type="button" onclick="addItem('pessoal')">Adicionar pessoa</button></div>
    </section>

    <section id="definicoes" class="page">
      <div class="card"><h2>Definições</h2><p class="small">Nesta primeira versão, os dados ficam guardados neste navegador. O login inicial é <b>admin</b> / <b>admin</b>.</p></div>
    </section>
  </main>
</section>

<script>
(function(){
  "use strict";

  var loginForm = document.getElementById("loginForm");
  var loginUser = document.getElementById("loginUser");
  var loginPass = document.getElementById("loginPass");
  var loginError = document.getElementById("loginError");
  var loginScreen = document.getElementById("loginScreen");
  var app = document.getElementById("app");
  var logoutButton = document.getElementById("logoutButton");

  function showApp(){
    loginScreen.style.display = "none";
    app.style.display = "block";
    loginUser.value = "";
    loginPass.value = "";
    loginError.style.display = "none";
    renderAll();
  }

  loginForm.addEventListener("submit", function(event){
    event.preventDefault();
    event.stopPropagation();

    var u = String(loginUser.value || "").trim();
    var p = String(loginPass.value || "");

    if(u === "admin" && p === "admin"){
      showApp();
    }else{
      loginError.style.display = "block";
      loginPass.value = "";
      loginPass.focus();
    }
    return false;
  });

  logoutButton.addEventListener("click", function(){
    app.style.display = "none";
    loginScreen.style.display = "flex";
    loginUser.value = "";
    loginPass.value = "";
    loginError.style.display = "none";
    loginUser.focus();
  });

  document.querySelectorAll(".navbtn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".navbtn").forEach(function(b){b.classList.remove("active")});
      document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active")});
      btn.classList.add("active");
      document.getElementById(btn.getAttribute("data-page")).classList.add("active");
    });
  });

  var keys = ["tratores","reboques","maquinas","pessoal"];

  function load(key){
    try{
      var v = localStorage.getItem("frota_"+key);
      return v ? JSON.parse(v) : [];
    }catch(e){ return []; }
  }

  function save(key, data){
    try{ localStorage.setItem("frota_"+key, JSON.stringify(data)); }catch(e){}
  }

  window.addItem = function(key){
    var map = {
      tratores:["tratorNome","tratorMarca"],
      reboques:["reboqueNome","reboqueTipo"],
      maquinas:["maquinaNome","maquinaTipo"],
      pessoal:["pessoaNome","pessoaFuncao"]
    };
    var ids = map[key];
    var a = document.getElementById(ids[0]).value.trim();
    var b = document.getElementById(ids[1]).value.trim();
    if(!a){ alert("Preencha a identificação."); return; }
    var data = load(key);
    data.push({a:a,b:b});
    save(key,data);
    document.getElementById(ids[0]).value="";
    document.getElementById(ids[1]).value="";
    renderAll();
  };

  window.removeItem = function(key,index){
    var data = load(key);
    data.splice(index,1);
    save(key,data);
    renderAll();
  };

  function renderList(key, elId, labels){
    var el = document.getElementById(elId);
    var data = load(key);
    if(!data.length){
      el.innerHTML = '<p class="small">Ainda não existem registos.</p>';
      return;
    }
    var html = "<table><thead><tr><th>"+labels[0]+"</th><th>"+labels[1]+"</th><th></th></tr></thead><tbody>";
    data.forEach(function(item,i){
      html += "<tr><td>"+escapeHtml(item.a)+"</td><td>"+escapeHtml(item.b || "")+"</td><td><button class='action' type='button' onclick=\"removeItem('"+key+"',"+i+")\">Apagar</button></td></tr>";
    });
    html += "</tbody></table>";
    el.innerHTML = html;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function renderAll(){
    renderList("tratores","tratoresList",["Identificação","Marca / modelo"]);
    renderList("reboques","reboquesList",["Identificação","Tipo"]);
    renderList("maquinas","maquinasList",["Identificação","Tipo / modelo"]);
    renderList("pessoal","pessoalList",["Nome","Função"]);

    var html="";
    keys.forEach(function(k){
      html += '<div class="stat"><span>'+k.charAt(0).toUpperCase()+k.slice(1)+'</span><strong>'+load(k).length+'</strong></div>';
    });
    document.getElementById("stats").innerHTML=html;
  }
})();
</script>
</body>
</html>
